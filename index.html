<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Badee</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand">
      <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true">
        <rect x="2" y="7" width="15" height="15" rx="4" fill="none" stroke="var(--past)" stroke-width="2" opacity=".75"/>
        <rect x="13" y="7" width="15" height="15" rx="4" fill="none" stroke="var(--future)" stroke-width="2" opacity=".75"/>
        <rect x="7.5" y="5" width="15" height="19" rx="4.5" fill="var(--accent)" stroke="var(--accent-ink)" stroke-width="1.5"/>
      </svg>
      <h1>Badee</h1>
    </div>
    <input id="sceneName" class="scene-name" aria-label="Scene name" value="Bouncing ball">
    <div class="spacer"></div>
    <button class="btn icon" id="undoBtn" title="Undo" aria-label="Undo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 010 11H11"/></svg></button>
    <button class="btn icon" id="redoBtn" title="Redo" aria-label="Redo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14l5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 000 11H13"/></svg></button>
    <div class="popwrap">
      <button class="btn" id="newBtn" aria-label="New scene"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg><span class="t">New</span></button>
      <div class="pop panel" id="newPop" hidden>
        <strong>Start a new scene?</strong>
        <p>This clears every shape and keyframe. You can still undo it.</p>
        <div class="row2"><button class="btn" id="newCancel">Cancel</button><button class="btn danger" id="newOk">Clear scene</button></div>
      </div>
    </div>
  </header>

  <aside class="lib panel" aria-label="Add a shape"><div class="eyebrow">Add</div></aside>

  <main class="view" id="view">
    <div class="hud"><span class="lbl">Frame</span><b id="hFrame">1</b><span class="recpill" id="hRec">REC</span></div>
    <div class="float tools" role="toolbar" aria-label="Tools">
      <button class="tool" data-mode="translate" aria-pressed="true" title="Move (M)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18M3 12h18M12 3l-3 3M12 3l3 3M12 21l-3-3M12 21l3-3M3 12l3-3M3 12l3 3M21 12l-3-3M21 12l-3 3"/></svg><span class="t">Move</span></button>
      <button class="tool" data-mode="rotate" aria-pressed="false" title="Turn (T)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 11-2.6-5.9"/><path d="M20 4v5h-5"/></svg><span class="t">Turn</span></button>
      <button class="tool" data-mode="scale" aria-pressed="false" title="Resize (S)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M10 20H4v-6M20 4l-7 7M4 20l7-7"/></svg><span class="t">Resize</span></button>
      <span class="sep"></span>
      <button class="tool" id="homeBtn" title="Reset camera" aria-label="Reset camera"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M3 9V5a2 2 0 012-2h4M15 3h4a2 2 0 012 2v4M21 15v4a2 2 0 01-2 2h-4M9 21H5a2 2 0 01-2-2v-4"/></svg></button>
    </div>
    <div class="float selbar" id="selbar" hidden>
      <span class="selname" id="selName"></span>
      <div class="sw" id="swatches"></div>
      <span class="sep"></span>
      <button class="tool" id="dupBtn" title="Duplicate" aria-label="Duplicate"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="8" y="8" width="12" height="12" rx="2.5"/><path d="M16 8V6a2 2 0 00-2-2H6a2 2 0 00-2 2v8a2 2 0 002 2h2"/></svg></button>
      <button class="tool danger" id="delBtn" title="Delete" aria-label="Delete"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 002 2h6a2 2 0 002-2l1-12M9 7V4h6v3"/></svg></button>
    </div>
    <div class="hint" id="hint"></div>
    <div class="toast" id="toast" role="status"></div>
  </main>

  <section class="time panel" aria-label="Timeline">
    <div class="tbar">
      <div class="grp">
        <button class="tbtn" id="bPrev" title="Previous frame (←)" aria-label="Previous frame"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
        <button class="tbtn play" id="bPlay" title="Play (Space)" aria-label="Play"><svg viewBox="0 0 24 24" fill="currentColor" id="playIco"></svg></button>
        <button class="tbtn" id="bNext" title="Next frame (→)" aria-label="Next frame"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
      </div>
      <div class="readout"><span id="fNow" style="color:var(--ink);font-weight:600">1</span><span class="of"> / <span id="fLen">24</span></span></div>
      <div class="spacer"></div>
      <button class="btn rec" id="recBtn" aria-pressed="true" title="When on, every change saves a keyframe at this frame"><span class="dot"></span><span class="t">Record</span></button>
      <button class="btn" id="keyBtn" title="Add or remove a keyframe here (K)"><span class="diamond"></span><span class="t" id="keyTxt">Add key</span></button>
      <button class="btn toggle" id="onionBtn" aria-pressed="true" title="Show ghosts of nearby frames (O)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="6" width="10" height="12" rx="2.5" opacity=".5"/><rect x="11" y="6" width="10" height="12" rx="2.5" opacity=".5"/><rect x="7" y="4" width="10" height="16" rx="2.5"/></svg><span class="t">Onion skin</span></button>
      <button class="btn icon" id="setBtn" title="Settings" aria-label="Settings" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></button>
    </div>
    <div class="pop panel" id="setPop" hidden>
      <div class="set">
        <span class="eyebrow">Onion skin</span>
        <div class="stepper"><span class="lbl"><i style="background:var(--past)"></i>Earlier ghosts</span><span class="ctl"><button data-k="before" data-d="-1" aria-label="Fewer">−</button><b id="obN">2</b><button data-k="before" data-d="1" aria-label="More">+</button></span></div>
        <div class="stepper"><span class="lbl"><i style="background:var(--future)"></i>Later ghosts</span><span class="ctl"><button data-k="after" data-d="-1" aria-label="Fewer">−</button><b id="oaN">2</b><button data-k="after" data-d="1" aria-label="More">+</button></span></div>
        <label class="fld"><span>Gap between ghosts</span><select class="inp" id="spaceSel">
          <option value="1">1 frame</option><option value="2">2 frames</option><option value="3">3 frames</option><option value="4">4 frames</option><option value="6">6 frames</option></select></label>
        <label class="fld"><span>Ghost strength <b id="opVal" style="font:500 13px var(--f-mono)"></b></span><input type="range" id="opRange" min="10" max="70" step="5"></label>
        <button class="switch" id="pathSw" role="switch" aria-checked="true">Show motion path<span class="trk"></span></button>
      </div>
      <div class="set">
        <span class="eyebrow">Animation</span>
        <div class="two">
          <label class="fld"><span>Length</span><select class="inp" id="lenSel"></select></label>
          <label class="fld"><span>Speed</span><select class="inp" id="fpsSel"></select></label>
        </div>
        <div class="seg" id="easeSeg"><button data-v="smooth" aria-pressed="true">Smooth</button><button data-v="linear" aria-pressed="false">Steady</button></div>
        <button class="switch" id="loopSw" role="switch" aria-checked="true">Loop playback<span class="trk"></span></button>
        <button class="switch" id="snapSw" role="switch" aria-checked="false">Snap while moving<span class="trk"></span></button>
      </div>
    </div>
    <div class="tracks" id="tracks"><div class="tinner" id="tinner"></div></div>
  </section>
</div>

  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/TransformControls.js"></script>
  <script src="app.js"></script>
</body>
</html>
